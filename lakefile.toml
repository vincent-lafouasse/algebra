name = "algebra"
version = "0.1.0"
defaultTargets = ["Base", "Algebra"]
# defaultTargets = ["Base", "Algebra", "Exercises"]

[leanOptions]
linter.all = true
linter.missingDocs = false
# no "declaration uses `sorry`" warnings: `scripts/check.py` counts stubs from the axioms instead
warn.sorry = false

# foundations: logic, functions, bijections, sets, order. Imports nothing but core.
# Its own lib (and module prefix) so it can move to its own repo without renaming imports.
[[lean_lib]]
name = "Base"

# the from-scratch library: never imports Mathlib
[[lean_lib]]
name = "Algebra"

# exercise sheets, built on top of `Algebra`
[[lean_lib]]
name = "Exercises"

# dev tooling only (`scripts/lint.sh`); `Algebra` never imports it
[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.35.0"

[[require]]
name = "lean-fmt"
git = "https://github.com/jcreinhold/lean-fmt"
rev = "v4.35.0"
