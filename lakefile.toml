name = "algebra"
version = "0.1.0"
defaultTargets = ["Algebra", "Exercises"]

[leanOptions]
linter.all = true
linter.missingDocs = false

# the from-scratch library: never imports Mathlib
[[lean_lib]]
name = "Algebra"

# exercise sheets, built on top of `Algebra`
[[lean_lib]]
name = "Exercises"

# dev tooling only (`scripts/lint.sh`); `Algebra` never imports it
[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.35.0"
